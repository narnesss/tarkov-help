name: Check Laravel and Cloudflare export
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, curl
          coverage: none
          tools: composer
      - name: Install locked Laravel dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app src config bootstrap routes database tests public -name '*.php' -not -path '*/cache/*' -print0 | xargs -0 -n1 php -l
      - name: Laravel HTTP, cache and storage tests
        run: php artisan test
      - name: Domain regressions
        run: php tests/php/run.php
      - name: Export Blade pages
        run: php artisan site:export
      - name: Build and verify Cloudflare export
        run: npm run build && npm test
      - name: Reject stale Blade export
        run: node scripts/check-export-freshness.mjs
      - name: Validate Workers deployment configuration
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy --dry-run
      - name: Production optimization
        run: php artisan optimize && php artisan optimize:clear
      - name: Package alwaysdata API without assets or private data
        run: npm run package:alwaysdata
      - name: API-only deployment routes
        env:
          API_ONLY: 'true'
        run: |
          php artisan route:list --json | php -r '$routes = json_decode(stream_get_contents(STDIN), true, flags: JSON_THROW_ON_ERROR); foreach ($routes as $route) { if (!in_array($route["uri"], ["up", "api/{path?}", "api/content/data/{path}", "api/content/quest/{quest}", "api/auth/options", "api/auth/oauth/{provider}/start", "api/auth/oauth/{provider}/finish"]) && !str_starts_with($route["uri"], "admin")) { throw new RuntimeException("Unexpected public route: ".$route["uri"]); } }'
      - name: Repeat production deploy without losing APP_KEY or SQLite
        run: php scripts/check-alwaysdata-deployment.php
      - name: Isolated SQLite restore round trip
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: /must-not-open-production.sqlite
          APP_CONFIG_CACHE: /must-not-read-production.php
        run: php deployment/alwaysdata/check-restore.php
      - uses: actions/upload-artifact@v4
        with:
          name: alwaysdata-api
          path: build/alwaysdata-api.tar.gz
          retention-days: 7
      - name: Ensure committed output matches source
        run: git diff --exit-code -- public dist
  deploy-alwaysdata:
    name: Deploy Laravel API to alwaysdata
    needs: [check, mysql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: alwaysdata-production
      cancel-in-progress: false
    environment:
      name: alwaysdata-production
      url: https://narnes.alwaysdata.net/up
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: alwaysdata-api
          path: build
      - name: Upload and activate the verified API release
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: bash deployment/alwaysdata/github-deploy.sh
      - name: Verify restore on a disposable SQLite on alwaysdata
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: bash deployment/alwaysdata/github-deploy.sh test-restore
  mysql:
    name: MariaDB, сохранность переноса и backup/restore
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-only
          MARIADB_DATABASE: tarkov_migration_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, curl
          coverage: none
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - run: composer install --no-interaction --prefer-dist
      - name: Orchid, связи, зависимости, аккаунты и CAS на MariaDB
        env:
          DB_PASSWORD: isolated-ci-only
        run: php vendor/bin/phpunit -c phpunit.mysql.xml
      - name: Перенос ID/rowid, прогресса, архивов и native backup/restore
        env:
          MYSQL_TEST_PASSWORD: isolated-ci-only
        run: php scripts/check-mysql-migration.php
