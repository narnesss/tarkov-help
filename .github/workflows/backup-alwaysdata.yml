name: Daily SQLite backup on alwaysdata
on:
  schedule:
    # 03:30 Europe/Moscow; GitHub cron использует UTC.
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: alwaysdata-production
      cancel-in-progress: false
    environment: alwaysdata-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create and rotate SQLite snapshots on alwaysdata
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ALWAYSDATA_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: bash deployment/alwaysdata/github-deploy.sh backup
